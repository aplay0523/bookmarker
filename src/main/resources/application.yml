spring:
  application:
    name: Book Marker.

server.error:
  include-exception: true
  include-stacktrace: never
  whitelabel.enabled: false

---
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.library.bookmarker.vo
  configuration:
    map-underscore-to-camel-case: true

spring:
  config:
    import: optional:file:.env[.properties]   # 민감 정보 env 스프링 설정 정보로 등록

  profiles:
    active: local

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 8 # 동시 사용 최대 커넥션 수
          max-idle: 8   # 대기 상태 유지 커넥션 수
          min-idle: 0   # 최소 대기 커넥션 수

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_OAUTH2_GOOGLE_ID}
            client-secret: ${SPRING_OAUTH2_GOOGLE_SECRET}
            scope: profile, email
          kakao:
            client-id: ${SPRING_OAUTH2_KAKAO_ID}
            client-secret: ${SPRING_OAUTH2_KAKAO_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: profile_nickname
            client-name: Kakao
          naver:
            client-id: ${SPRING_OAUTH2_NAVER_ID}
            client-secret: ${SPRING_OAUTH2_NAVER_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            scope: name, email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
---
# 로컬 설정 분기
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

server:
  port: 8085

logging:
  config: classpath:log4j2-local.xml

---
# 운영 설정 분기
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

server:
  port: 80

logging:
  config: classpath:log4j2-prod.xml