<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<header class="blog-header py-3" th:fragment="header">
  <div class="row flex-nowrap justify-content-between align-items-center">
    <div class="col-4">
      <a class="blog-header-logo text-dark" th:href="@{/}">BookMarker</a>
    </div>
    <div class="col-4 d-flex justify-content-end align-items-center">
      <!--<a class="text-muted" th:href="@{/book-search}">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-3">
          <circle cx="10.5" cy="10.5" r="7.5"></circle>
          <line x1="21" y1="21" x2="15.8" y2="15.8"></line>
        </svg>
      </a>-->
      <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
                  <span class="text-dark fw-bold me-3 text-truncate flex-shrink-1" style="min-width: 0;">
                      (<span sec:authentication="principal.userVo.provider"></span>)
                      <span sec:authentication="principal.userVo.name">유저</span>님 환영합니다
                  </span>
        <form th:action="@{/logout}" method="post" class="m-0 flex-shrink-0">
          <button type="submit" class="btn btn-sm btn-outline-danger text-nowrap">로그아웃</button>
        </form>
      </div>

      <div sec:authorize="isAnonymous()">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/login}">Sign up</a>
      </div>
    </div>
  </div>
</header>

</html>
