<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>내 정보</title>
</head>
<body class="bg-light">
<th:block layout:fragment="script">
    <script th:inline="javascript">
        $(function() {
            $('#delAccountBtn').on('click', function() {
                const result = confirm('회원 탈퇴를 진행하시겠습니까?');
                if (result) {
                    submitDeleteAccount();
                }
            });
        });

        function submitDeleteAccount() {
            $.ajax({
                    url :  '/myPage/api/user',
                    type : 'delete',
                    success : function(response) {
                        alert('회원 탈퇴 처리가 완료되었습니다. 메인으로 되돌아갑니다.');
                        window.location.href = '/';
                    },
                    error : function(e) {
                        console.error('회원 탈퇴처리 실패', e);
                    }
            });
        };
    </script>
</th:block>

<div layout:fragment="content" class="container">
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3">
            <h5 class="card-title fw-bold mb-0">기본 프로필 정보</h5>
        </div>
        <div class="card-body p-4">
            <div class="row mb-3">
                <label class="col-sm-3 col-form-label fw-semibold text-muted">이름</label>
                <div class="col-sm-9 d-flex align-items-center">
                    <span id="userName" class="fw-semibold" th:text="${data.name}">홍길동</span>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-3 col-form-label fw-semibold text-muted">이메일</label>
                <div class="col-sm-9 d-flex align-items-center">
                    <span id="userEmail" th:text="${data.email}">user@example.com</span>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-3 col-form-label fw-semibold text-muted">계정 유형</label>
                <div class="col-sm-9 d-flex align-items-center">
                    <span id="providerBadge" class="badge bg-warning text-dark px-3 py-2" th:text="${data.provider}">카카오 로그인</span>
                </div>
            </div>
            <div class="row mb-0">
                <label class="col-sm-3 col-form-label fw-semibold text-muted">가입일</label>
                <div class="col-sm-9 d-flex align-items-center">
                    <span id="createDt" class="text-muted" th:text="${data.createDt}">2026-01-01</span>
                </div>
            </div>

        </div>
    </div>

    <div class="card shadow-sm border-0 border-top border-danger border-3">
        <div class="card-body p-4 d-flex justify-content-between align-items-center">
            <div>
                <h6 class="fw-bold text-danger mb-1">회원 탈퇴</h6>
                <p class="text-muted small mb-0">탈퇴 시 작성하신 게시글 및 개인 정보가 모두 삭제될 수 있습니다.</p>
            </div>
            <button type="button" class="btn btn-outline-danger fw-semibold btn-sm ms-3" id="delAccountBtn">
                회원 탈퇴
            </button>
        </div>
    </div>
</div>

</body>
</html>
